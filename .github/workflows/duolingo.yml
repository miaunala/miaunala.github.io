name: Daily Duolingo Streak

# Der Streak aendert sich taeglich -- der woechentliche Pipeline-Lauf waere bis
# zu 7 Tage veraltet. Deshalb ein eigener, winziger Job: nur ein HTTP-Abruf,
# keine Abhaengigkeiten, wenige Sekunden.
on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Fetch streak
        working-directory: pipeline
        run: python -c "from duolingo import duolingo; duolingo()"

      - name: Commit if changed
        run: |
          git config user.name "skill-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/duolingo.json
          if git diff --staged --quiet; then
            echo "Streak unveraendert."
          else
            git commit -m "chore: update Duolingo streak ($(date +%Y-%m-%d))"
            git pull --rebase --autostash
            git push
          fi
