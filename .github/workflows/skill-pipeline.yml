name: Weekly Skill Pipeline

# Laeuft woechentlich (Montag 03:00 UTC) und kann manuell ausgeloest werden.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write   # zum Committen des generierten market_skills.json

jobs:
  build-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline
        working-directory: pipeline
        env:
          # In GitHub -> Settings -> Secrets hinterlegen. Fehlen sie, nutzt die
          # Pipeline automatisch die Beispiel-Anzeigen.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_KEY: ${{ secrets.ADZUNA_KEY }}
          # Fuer die GitHub-Belege (eigene Repos lesen). Der Standard-Token des
          # Workflows reicht; die gh-CLI ist auf den Runnern vorinstalliert.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python run.py

      - name: Commit updated network
        run: |
          git config user.name "skill-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/market_skills.json src/data/duolingo.json pipeline/warehouse.duckdb
          if git diff --staged --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "chore: update market skill network ($(date +%Y-%m-%d))"
            git push
          fi
